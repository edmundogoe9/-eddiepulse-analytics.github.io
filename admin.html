<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EddiePulse Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  margin: 0;
  padding: 18px;
}
.container { max-width: 750px; margin: auto; }
h1 { color: #35d07f; }
.card {
  background: #202c40;
  padding: 16px;
  border-radius: 10px;
  margin: 15px 0;
}
input, textarea, select, button {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border-radius: 7px;
  border: 1px solid #46536a;
  font-size: 16px;
}
input, textarea, select {
  background: #101827;
  color: white;
}
textarea { min-height: 90px; }
button {
  background: #35d07f;
  color: #101827;
  font-weight: bold;
  border: none;
  cursor: pointer;
}
.secondary { background: #40516c; color: white; }
.danger { background: #c83e4d; color: white; }
.hidden { display: none; }
.status { color: #35d07f; }
small { color: #bdc8d8; }
.section-title { color: #35d07f; }
</style>
</head>

<body>
<div class="container">

<h1>⚽ EddiePulse Analytics</h1>
<h2>Admin Dashboard</h2>

<div id="loginBox" class="card">
  <h3>Owner Login</h3>
  <input id="email" type="email" placeholder="Owner email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="dashboard" class="hidden">

<p class="status">✓ Owner access verified</p>
<button class="secondary" onclick="logout()">Logout</button>

<div class="card">
  <h3 id="formTitle">Add New Prediction</h3>

  <label>Prediction category</label>
  <select id="category">
    <option value="free_picks">Free Prediction</option>
    <option value="premium_picks">Premium Prediction</option>
  </select>

  <input id="match" placeholder="Match (e.g. Arsenal vs Chelsea)">
  <input id="prediction" placeholder="Prediction (e.g. Over 1.5 Goals)">
  <textarea id="analysis" placeholder="Write your match analysis"></textarea>

  <label>Match date</label>
  <input id="matchDate" type="date">

  <label>
    <input id="published" type="checkbox" checked style="width:auto">
    Publish immediately
  </label>

  <button onclick="savePick()">Save Prediction</button>
  <button class="secondary hidden" id="cancelEdit" onclick="resetForm()">Cancel Edit</button>

  <p id="message"></p>
</div>

<h2 class="section-title">🟢 Free Predictions</h2>
<div id="freePicks">Loading free predictions...</div>

<h2 class="section-title">⭐ Premium Predictions</h2>
<div id="premiumPicks">Loading premium predictions...</div>

</div>
</div>

<script>
const SUPABASE_URL = "https://mneqdvkagthqzgwsalkw.supabase.co";
const SUPABASE_KEY = "sb_publishable_QPWs81qv_fV4k7NptQ7HCQ_KZ7hv16";
const OWNER_ID = "aa8c51b1-37b3-4ffc-a1c3-011930c924ee";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;
let editingTable = null;

async function checkSession() {
  const { data: { session } } = await db.auth.getSession();

  if (!session) {
    showLogin();
    return;
  }

  if (session.user.id !== OWNER_ID) {
    document.getElementById("loginBox").innerHTML =
      "<p>Access denied. This account is not the owner.</p>";
    showLogin();
    return;
  }

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  loadAllPicks();
}

function showLogin() {
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("dashboard").classList.add("hidden");
}

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert(error.message);
    return;
  }

  checkSession();
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

function selectedTable() {
  return document.getElementById("category").value;
}

async function savePick() {
  const table = editingTable || selectedTable();

  const match = document.getElementById("match").value.trim();
  const prediction = document.getElementById("prediction").value.trim();
  const analysis = document.getElementById("analysis").value.trim();
  const matchDate = document.getElementById("matchDate").value;
  const published = document.getElementById("published").checked;

  if (!match || !prediction) {
    alert("Please enter the match and prediction.");
    return;
  }

  const pick = {
    match_name: match,
    prediction: prediction,
    analysis: analysis,
    match_date: matchDate || null,
    is_published: published
  };

  let result;

  if (editingId) {
    result = await db.from(table)
      .update(pick)
      .eq("id", editingId);
  } else {
    result = await db.from(table).insert(pick);
  }

  if (result.error) {
    alert(result.error.message);
    return;
  }

  document.getElementById("message").textContent =
    "✓ Prediction saved successfully!";

  resetForm();
  loadAllPicks();
}

async function loadAllPicks() {
  await loadPicks("free_picks", "freePicks");
  await loadPicks("premium_picks", "premiumPicks");
}

async function loadPicks(table, containerId) {
  const box = document.getElementById(containerId);
  box.textContent = "Loading...";

  const { data, error } = await db
    .from(table)
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    box.textContent = "Error: " + error.message;
    return;
  }

  box.innerHTML = "";

  if (!data || data.length === 0) {
    box.textContent = "No predictions added yet.";
    return;
  }

  data.forEach(pick => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = pick.match_name;

    const prediction = document.createElement("p");
    prediction.textContent = "Prediction: " + pick.prediction;

    const analysis = document.createElement("p");
    analysis.textContent = pick.analysis || "";

    const date = document.createElement("small");
    date.textContent = "Match date: " + (pick.match_date || "Not set");

    const status = document.createElement("p");
    status.textContent = pick.is_published ? "🟢 Published" : "🔴 Unpublished";

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.className = "secondary";
    edit.onclick = () => editPick(pick, table);

    const toggle = document.createElement("button");
    toggle.textContent = pick.is_published ? "Unpublish" : "Publish";
    toggle.className = "secondary";
    toggle.onclick = () => togglePublish(pick, table);

    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.className = "danger";
    remove.onclick = () => deletePick(pick.id, table);

    card.append(title, prediction, analysis, date, status, edit, toggle, remove);
    box.appendChild(card);
  });
}

function editPick(pick, table) {
  editingId = pick.id;
  editingTable = table;

  document.getElementById("category").value = table;
  document.getElementById("category").disabled = true;
  document.getElementById("match").value = pick.match_name;
  document.getElementById("prediction").value = pick.prediction;
  document.getElementById("analysis").value = pick.analysis || "";
  document.getElementById("matchDate").value = pick.match_date || "";
  document.getElementById("published").checked = pick.is_published;

  document.getElementById("formTitle").textContent = "Edit Prediction";
  document.getElementById("cancelEdit").classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function togglePublish(pick, table) {
  const { error } = await db.from(table)
    .update({ is_published: !pick.is_published })
    .eq("id", pick.id);

  if (error) {
    alert(error.message);
    return;
  }

  loadAllPicks();
}

async function deletePick(id, table) {
  if (!confirm("Are you sure you want to delete this prediction?")) {
    return;
  }

  const { error } = await db.from(table)
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  loadAllPicks();
}

function resetForm() {
  editingId = null;
  editingTable = null;

  document.getElementById("category").disabled = false;
  document.getElementById("category").value = "free_picks";
  document.getElementById("match").value = "";
  document.getElementById("prediction").value = "";
  document.getElementById("analysis").value = "";
  document.getElementById("matchDate").value = "";
  document.getElementById("published").checked = true;

  document.getElementById("formTitle").textContent = "Add New Prediction";
  document.getElementById("cancelEdit").classList.add("hidden");
}

checkSession();
</script>

</body>
</html>
