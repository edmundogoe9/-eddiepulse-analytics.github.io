<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EddiePulse Analytics — Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  background: #08111f;
  color: white;
}

.container {
  max-width: 750px;
  margin: auto;
}

h1 { color: #35d07f; }

.card {
  background: #102238;
  border: 1px solid #29415b;
  border-radius: 14px;
  padding: 18px;
  margin: 18px 0;
}

input, textarea, select, button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  border-radius: 9px;
  font-size: 16px;
}

input, textarea, select {
  background: #08111f;
  border: 1px solid #29415b;
  color: white;
}

textarea { min-height: 100px; }

button {
  border: none;
  background: #35d07f;
  color: #08111f;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: #40516c;
  color: white;
}

.danger {
  background: #c83e4d;
  color: white;
}

.hidden { display: none; }

.match {
  background: #0b192a;
  border-radius: 10px;
  padding: 14px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}

.match h3 { margin-top: 0; }

.status { color: #35d07f; }

.message {
  overflow-wrap: anywhere;
  line-height: 1.5;
}

label { display: block; margin-top: 12px; }

.publish-label {
  display: flex;
  align-items: center;
  gap: 10px;
}

.publish-label input {
  width: auto;
}

small { color: #bdc8d8; }
</style>
</head>

<body>

<div class="container">

<h1>⚡ EddiePulse Analytics</h1>
<h2>Admin Dashboard</h2>

<div id="loginBox" class="card">

  <h3>Owner Login</h3>

  <form id="loginForm">

    <input
      id="email"
      type="email"
      placeholder="Owner email"
      autocomplete="username"
      required
    >

    <input
      id="password"
      type="password"
      placeholder="Owner password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      Login to Dashboard
    </button>

  </form>

  <p id="loginMessage" class="message"></p>

</div>


<div id="dashboard" class="hidden">

  <p class="status">✓ Owner dashboard</p>

  <button id="logoutButton" class="secondary">
    Logout
  </button>

  <div class="card">

    <h3 id="formTitle">Add New Prediction</h3>

    <label for="category">Prediction category</label>

    <select id="category">
      <option value="free_picks">Free Predictions</option>
      <option value="premium_picks">Premium Predictions</option>
    </select>

    <input
      id="match"
      placeholder="Match (e.g. Arsenal vs Chelsea)"
      required
    >

    <input
      id="prediction"
      placeholder="Prediction (e.g. Over 1.5 Goals)"
      required
    >

    <textarea
      id="analysis"
      placeholder="Write your match analysis"
    ></textarea>

    <label for="matchDate">Match date</label>

    <input id="matchDate" type="date">

    <label class="publish-label">
      <input id="published" type="checkbox" checked>
      Publish immediately
    </label>

    <button id="saveButton">
      Save Prediction
    </button>

    <button
      id="cancelEdit"
      class="secondary hidden"
      type="button"
    >
      Cancel Edit
    </button>

    <p id="saveMessage" class="message"></p>

  </div>


  <div class="card">

    <h3>🟢 Free Predictions</h3>

    <div id="freePicks">
      Loading free predictions...
    </div>

  </div>


  <div class="card">

    <h3>💎 Premium Predictions</h3>

    <div id="premiumPicks">
      Loading premium predictions...
    </div>

  </div>

</div>

</div>


<script>

const SUPABASE_URL =
  "https://mneqdvkagthqzgwsalkw.supabase.co";

// Use the exact Publishable key copied from your Supabase dashboard.
const SUPABASE_KEY =
  "sb_publishable_QPWs81qv_fV4k7NptQ7HCQ_KZ7hv16X";

const OWNER_ID =
  "aa8c51b1-37b3-4ffc-a1c3-011930c924ee";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let editingId = null;
let editingTable = null;

const loginBox = document.getElementById("loginBox");
const dashboard = document.getElementById("dashboard");

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const loginMessage = document.getElementById("loginMessage");

const category = document.getElementById("category");
const matchInput = document.getElementById("match");
const predictionInput = document.getElementById("prediction");
const analysisInput = document.getElementById("analysis");
const matchDateInput = document.getElementById("matchDate");
const publishedInput = document.getElementById("published");

const saveMessage = document.getElementById("saveMessage");
const saveButton = document.getElementById("saveButton");
const cancelEdit = document.getElementById("cancelEdit");

function showLogin() {
  loginBox.classList.remove("hidden");
  dashboard.classList.add("hidden");
}

function showDashboard() {
  loginBox.classList.add("hidden");
  dashboard.classList.remove("hidden");
}

async function checkSession() {

  loginMessage.textContent = "Checking login...";

  const { data, error } = await db.auth.getSession();

  if (error) {
    loginMessage.textContent = error.message;
    showLogin();
    return;
  }

  const session = data.session;

  if (!session) {
    loginMessage.textContent = "";
    showLogin();
    return;
  }

  if (session.user.id !== OWNER_ID) {

    await db.auth.signOut();

    loginMessage.textContent =
      "Access denied. Please sign in with the owner account.";

    showLogin();
    return;
  }

  showDashboard();

  await loadAllPicks();
}


// OWNER LOGIN

loginForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  loginButton.disabled = true;
  loginButton.textContent = "Signing in...";
  loginMessage.textContent = "";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {

    const { error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) throw error;

    await checkSession();

  } catch (error) {

    loginMessage.textContent = error.message;

  } finally {

    loginButton.disabled = false;
    loginButton.textContent = "Login to Dashboard";

  }

});


// LOGOUT

document.getElementById("logoutButton")
.addEventListener("click", async function() {

  await db.auth.signOut();

  location.reload();

});


// SELECT DATABASE TABLE

function selectedTable() {
  return category.value;
}


// SAVE OR UPDATE PREDICTION

saveButton.addEventListener("click", savePick);

async function savePick() {

  const match = matchInput.value.trim();
  const prediction = predictionInput.value.trim();

  if (!match || !prediction) {
    saveMessage.textContent =
      "Please enter the match and prediction.";
    return;
  }

  const table = editingId ? editingTable : selectedTable();

  const pick = {
    match_name: match,
    prediction: prediction,
    analysis: analysisInput.value.trim(),
    match_date: matchDateInput.value || null,
    is_published: publishedInput.checked
  };

  saveButton.disabled = true;
  saveMessage.textContent = "Saving prediction...";

  try {

    let result;

    if (editingId) {

      result = await db
        .from(table)
        .update(pick)
        .eq("id", editingId);

    } else {

      result = await db
        .from(table)
        .insert(pick);

    }

    if (result.error) throw result.error;

    saveMessage.textContent =
      "✅ Prediction saved successfully.";

    resetForm();

    await loadAllPicks();

  } catch (error) {

    saveMessage.textContent =
      "❌ " + error.message;

  } finally {

    saveButton.disabled = false;

  }

}


// LOAD BOTH CATEGORIES

async function loadAllPicks() {

  await loadPicks("free_picks", "freePicks");

  await loadPicks("premium_picks", "premiumPicks");

}


async function loadPicks(table, elementId) {

  const box = document.getElementById(elementId);

  box.textContent = "Loading...";

  const { data, error } = await db
    .from(table)
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {

    box.textContent = "Unable to load: " + error.message;

    return;

  }

  box.replaceChildren();

  if (!data || data.length === 0) {

    box.textContent = "No predictions added yet.";

    return;

  }

  data.forEach(pick => {

    const card = document.createElement("div");
    card.className = "match";

    const title = document.createElement("h3");
    title.textContent = pick.match_name;

    const prediction = document.createElement("p");
    prediction.textContent = "Prediction: " + pick.prediction;

    const analysis = document.createElement("p");
    analysis.textContent = pick.analysis || "No analysis added.";

    const date = document.createElement("small");
    date.textContent =
      "Match date: " + (pick.match_date || "Not set");

    const status = document.createElement("p");
    status.className = "status";
    status.textContent =
      pick.is_published ? "Published" : "Unpublished";

    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.className = "secondary";
    edit.addEventListener("click", () => editPick(pick, table));

    const toggle = document.createElement("button");
    toggle.textContent =
      pick.is_published ? "Unpublish" : "Publish";
    toggle.className = "secondary";
    toggle.addEventListener("click", () => togglePublish(pick, table));

    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.className = "danger";
    remove.addEventListener("click", () => deletePick(pick.id, table));

    card.append(
      title,
      prediction,
      analysis,
      date,
      status,
      edit,
      toggle,
      remove
    );

    box.appendChild(card);

  });

}


// EDIT PREDICTION

function editPick(pick, table) {

  editingId = pick.id;
  editingTable = table;

  category.value = table;
  category.disabled = true;

  matchInput.value = pick.match_name;
  predictionInput.value = pick.prediction;
  analysisInput.value = pick.analysis || "";
  matchDateInput.value = pick.match_date || "";
  publishedInput.checked = pick.is_published;

  document.getElementById("formTitle").textContent =
    "Edit Prediction";

  saveButton.textContent = "Update Prediction";

  cancelEdit.classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });

}


// PUBLISH OR UNPUBLISH

async function togglePublish(pick, table) {

  const { error } = await db
    .from(table)
    .update({ is_published: !pick.is_published })
    .eq("id", pick.id);

  if (error) {

    alert(error.message);
    return;

  }

  await loadAllPicks();

}


// DELETE PREDICTION

async function deletePick(id, table) {

  if (!confirm("Are you sure you want to delete this prediction?")) {
    return;
  }

  const { error } = await db
    .from(table)
    .delete()
    .eq("id", id);

  if (error) {

    alert(error.message);
    return;

  }

  await loadAllPicks();

}


// RESET FORM

function resetForm() {

  editingId = null;
  editingTable = null;

  category.disabled = false;

  category.value = "free_picks";

  matchInput.value = "";
  predictionInput.value = "";
  analysisInput.value = "";
  matchDateInput.value = "";

  publishedInput.checked = true;

  document.getElementById("formTitle").textContent =
    "Add New Prediction";

  saveButton.textContent = "Save Prediction";

  cancelEdit.classList.add("hidden");

}

cancelEdit.addEventListener("click", resetForm);


// START

checkSession();

</script>

</body>
</html>
